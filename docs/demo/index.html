<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTMlore 2.0 · Demo</title>
  <meta name="description" content="HTMlore 2.0 只读静态预览：导入、筛选、阅读。无登录、无 AI、无后端。">
  <link rel="icon" href="assets/html-lore-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/">
        <img src="assets/html-lore-logo.svg" alt="">
        <strong>HTMlore</strong>
      </a>
      <div class="nav-label" data-i18n="library"></div>
      <button type="button" class="nav-btn" data-library="all"></button>
      <button type="button" class="nav-btn" data-library="recent"></button>
      <button type="button" class="nav-btn" data-library="favorites"></button>
      <button type="button" class="nav-btn" data-library="imported"></button>
      <button type="button" class="nav-btn" data-library="archived"></button>
      <div class="nav-label" data-i18n="collections"></div>
      <div id="collections"></div>
      <div class="nav-label" data-i18n="tags"></div>
      <div id="tags"></div>
    </aside>

    <div class="main">
      <div class="banner">
        <span data-i18n="banner"></span>
        <span>
          <a href="../">Pages</a>
          ·
          <a href="https://github.com/JMoCoder/html-lore">GitHub</a>
        </span>
      </div>

      <section id="workspace" class="workspace">
        <div class="topbar">
          <input class="search" id="search" type="search" autocomplete="off">
          <select class="sort" id="sort" aria-label="sort"></select>
          <select class="lang" id="lang" aria-label="language">
            <option value="zh-CN">中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
          </select>
          <button type="button" class="theme" id="theme"></button>
        </div>
        <div class="grid" id="grid"></div>
        <p class="empty" id="empty" hidden></p>
      </section>

      <section id="reader" class="reader">
        <div class="reader-bar">
          <button type="button" id="back"></button>
          <strong id="reader-title"></strong>
          <span></span>
        </div>
        <iframe id="frame" title="note" sandbox="allow-same-origin"></iframe>
      </section>
    </div>
  </div>
  <script src="demo.js"></script>
</body>
</html>
