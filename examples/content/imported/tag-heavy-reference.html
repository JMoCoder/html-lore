<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tag-Heavy Reference Sheet</title>
  <meta name="description" content="Six tags on metadata; the card should show the first three and keep the row height stable when filters are active.">
  <style>
    body { max-width: 860px; margin: 0 auto; padding: 32px; font-family: ui-sans-serif, system-ui, sans-serif; line-height: 1.7; }
    dl { display: grid; grid-template-columns: 120px 1fr; gap: 8px 16px; }
    dt { font-weight: 600; color: #555; }
  </style>
</head>
<body>
  <article>
    <h1>Tag-Heavy Reference Sheet</h1>
    <p>Use this note to confirm tag chips truncate gracefully on cards.</p>
    <dl>
      <dt>Visible</dt><dd>First three tags on the card face</dd>
      <dt>Hidden</dt><dd>Remaining tags still filter in the sidebar</dd>
    </dl>
  </article>
</body>
</html>
